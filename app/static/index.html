<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pixiv Vault</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0096FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixiv">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="data:,">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/viewer.min.css">
<script src="/viewer.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        pixiv: {
          blue: '#0096FA',
          light: '#F5F8FB',
          dark: '#212121',
          border: '#E5E9ED',
        }
      }
    }
  }
}
</script>
<style>
  html, body { height: 100%; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  /* Viewer.js 容器背景统一为纯黑（默认 backdrop 是半透明） */
  .viewer-container { background-color: #000; }
  /* iOS 安全区：底部留白（tabbar 高度 + Home 指示条） */
  #app { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
            border-top: 1px solid theme('colors.pixiv.border');
            padding-bottom: env(safe-area-inset-bottom); }
  @media (min-width: 768px) {
    .tabbar { top: 0; bottom: auto; padding-bottom: 0; border-top: none;
              border-bottom: 1px solid theme('colors.pixiv.border');
              padding-top: env(safe-area-inset-top); }
    #app { padding-bottom: 0; padding-top: calc(56px + env(safe-area-inset-top)); }
    /* 桌面端 tabbar 在顶部，面包屑/搜索框 sticky 需让出 tabbar 高度 */
    .sticky-bc { top: calc(56px + env(safe-area-inset-top)) !important; }
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  /* 触屏操作元素禁用文本选择 */
  button, .tabbar, .chip, img, #viewer, #content, #breadcrumb {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .chip-on { background: #0096FA !important; color: #fff !important; border-color: #0096FA !important; }
  .chip-series { background: #0096FA !important; color: #fff !important; border-color: #0096FA !important; }
  .chip-character { background: #E8F5FD !important; color: #0096FA !important; border-color: #0096FA !important; }
  .chip-series::after { content: ' 系列'; font-size: 0.6rem; opacity: 0.8; }
  .chip-character::after { content: ' 角色'; font-size: 0.6rem; opacity: 0.8; }
  .skeleton { animation: pulse 1.5s ease-in-out infinite; background: #eee; border-radius: 8px; }
  @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:0.4} }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
  .grid-img { aspect-ratio: 1 / 1; }
  .fade-in { animation: fadeIn 0.25s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body class="bg-pixiv-light text-pixiv-dark">
<div id="app"></div>

<!-- 底部导航（SVG 图标） -->
<nav class="tabbar grid grid-cols-3">
  <button id="nav-browse" class="py-2 text-center text-sm font-medium text-pixiv-blue border-t-2 border-pixiv-blue" onclick="showView('browse')">
    <svg class="w-6 h-6 mx-auto mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.5-3.5L6 21"/></svg>
    浏览
  </button>
  <button id="nav-download" class="py-2 text-center text-sm font-medium text-gray-400 border-t-2 border-transparent" onclick="showView('download')">
    <svg class="w-6 h-6 mx-auto mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
    下载
  </button>
  <button id="nav-settings" class="py-2 text-center text-sm font-medium text-gray-400 border-t-2 border-transparent" onclick="showView('settings')">
    <svg class="w-6 h-6 mx-auto mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    设置
  </button>
</nav>

<script src="/app.js?v=20260829c"></script>
</body>
</html>
